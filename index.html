<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パズサバ 資源採集時間計算機</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
      --header-bg: #e9ecef;
      --sticky-bg: #f8f9fa;
      --primary-color: #007bff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ヘッダー・言語切替 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .lang-select {
      padding: 6px 10px;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* 全体バフ設定 */
    .global-buff-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      background: #f0f4f8;
      padding: 12px 16px;
      border-radius: 6px;
    }

    .global-buff-container label {
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .number-input {
      width: 80px;
      padding: 6px 8px;
      font-size: 1rem;
      text-align: right;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* テーブル・スクロール領域 */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }

    th {
      background-color: var(--header-bg);
      font-weight: bold;
    }

    /* Sticky (固定列) の指定 */
    .col-sticky-1 {
      position: sticky;
      left: 0;
      z-index: 2;
      background-color: var(--sticky-bg);
      min-width: 70px;
      font-weight: bold;
    }

    .col-sticky-2 {
      position: sticky;
      left: 70px; /* col-sticky-1の幅に合わせる */
      z-index: 2;
      background-color: var(--sticky-bg);
      min-width: 90px;
      border-right: 2px solid #999 !important; /* 固定列の境目を強調 */
    }

    th.col-sticky-1, th.col-sticky-2 {
      z-index: 3; /* ヘッダーの固定交差点は最前面 */
      background-color: var(--header-bg);
    }

    /* 時間結果セル */
    .time-cell {
      font-family: monospace;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1 class="title" id="ui-title">資源採集時間計算機</h1>
    <select id="langSelect" class="lang-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh-TW">繁體中文</option>
      <option value="zh-CN">简体中文</option>
    </select>
  </div>

  <div class="global-buff-container">
    <label for="globalBuff" id="ui-globalBuffLabel">資源採集速度:</label>
    <input type="number" id="globalBuff" class="number-input" step="0.1" min="0" max="300" inputmode="decimal">
    <span>%</span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="col-sticky-1" id="ui-thResource">資源</th>
          <th class="col-sticky-2" id="ui-thSpeed">速度 (%)</th>
          <th>Lv7</th>
          <th>Lv6</th>
          <th>Lv5</th>
          <th>Lv4</th>
          <th>Lv3</th>
          <th>Lv2</th>
          <th>Lv1</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- JSで動的に描画 -->
      </tbody>
    </table>
  </div>
</div>

<script>
// --- 定数・マスタデータ ---
const RESOURCE_TYPES = [
  { key: 'food', ratio: 20 },
  { key: 'wood', ratio: 20 },
  { key: 'steel', ratio: 4 },
  { key: 'gas', ratio: 1 }
];

const BASE_AMOUNTS = {
  7: 20000,
  6: 14000,
  5: 10000,
  4: 6750,
  3: 4000,
  2: 2000,
  1: 1000
};

// 多言語辞書
const I18N = {
  ja: {
    title: '資源採集時間計算機',
    globalBuff: '資源採集速度:',
    resource: '資源',
    speed: '速度',
    food: '食料',
    wood: '木材',
    steel: '鉄鋼',
    gas: 'ガス'
  },
  en: {
    title: 'Gathering Time Calculator',
    globalBuff: 'Gathering Speed:',
    resource: 'Resource',
    speed: 'Speed',
    food: 'Food',
    wood: 'Wood',
    steel: 'Steel',
    gas: 'Gas'
  },
  'zh-TW': {
    title: '資源採集時間計算器',
    globalBuff: '資源採集速度:',
    resource: '資源',
    speed: '速度',
    food: '糧食',
    wood: '木材',
    steel: '鋼鐵',
    gas: '瓦斯'
  },
  'zh-CN': {
    title: '资源采集时间计算器',
    globalBuff: '资源采集速度:',
    resource: '资源',
    speed: '速度',
    food: '粮食',
    wood: '木材',
    steel: '钢铁',
    gas: '燃气'
  }
};

// 初期データ設定
const DEFAULT_SETTINGS = {
  lang: 'ja',
  globalBuff: 50.0,
  foodSpeed: 50.0,
  woodSpeed: 50.0,
  steelSpeed: 50.0,
  gasSpeed: 50.0
};

let state = { ...DEFAULT_SETTINGS };

// --- localStorage 処理 ---
function loadState() {
  const saved = localStorage.getItem('pns_gather_calc_settings');
  if (saved) {
    try {
      state = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
    } catch (e) {
      console.error('Failed to parse localStorage settings', e);
    }
  }
}

function saveState() {
  localStorage.setItem('pns_gather_calc_settings', JSON.stringify(state));
}

// --- 計算ロジック ---
// 秒数 = [基準資源量] ÷ (2160 × (120 + ([全体] + [固有])) ÷ 100) × 3600
function calculateSeconds(baseAmount, globalBuff, specificBuff) {
  const totalBuff = globalBuff + specificBuff;
  const speedFactor = 2160 * ((120 + totalBuff) / 100);
  const rawSeconds = (baseAmount / speedFactor) * 3600;
  return Math.ceil(rawSeconds); // 切り上げ処理
}

function formatTime(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const pad = (num) => String(num).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

// --- UI 描画 & 更新 ---
function updateLanguage() {
  const lang = state.lang;
  const dict = I18N[lang] || I18N.ja;

  document.getElementById('ui-title').innerText = dict.title;
  document.getElementById('ui-globalBuffLabel').innerText = dict.globalBuff;
  document.getElementById('ui-thResource').innerText = dict.resource;
  document.getElementById('ui-thSpeed').innerText = `${dict.speed} (%)`;

  RESOURCE_TYPES.forEach(res => {
    const labelElem = document.getElementById(`label-${res.key}`);
    if (labelElem) labelElem.innerText = dict[res.key];
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  RESOURCE_TYPES.forEach(res => {
    const tr = document.createElement('tr');

    // 固定列 1: 資源名
    const tdName = document.createElement('td');
    tdName.className = 'col-sticky-1';
    tdName.id = `label-${res.key}`;
    tr.appendChild(tdName);

    // 固定列 2: 固有速度入力欄
    const tdInput = document.createElement('td');
    tdInput.className = 'col-sticky-2';
    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'number-input';
    input.step = '0.1';
    input.min = '0';
    input.max = '500';
    input.setAttribute('inputmode', 'decimal');
    input.value = state[`${res.key}Speed`];
    input.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value) || 0;
      state[`${res.key}Speed`] = val;
      saveState();
      recalculate();
    });
    tdInput.appendChild(input);
    tr.appendChild(tdInput);

    // Lv7 ～ Lv1 の計算結果セル
    for (let level = 7; level >= 1; level--) {
      const tdTime = document.createElement('td');
      tdTime.className = 'time-cell';
      tdTime.id = `time-${res.key}-${level}`;
      tr.appendChild(tdTime);
    }

    tbody.appendChild(tr);
  });
}

function recalculate() {
  const globalBuff = parseFloat(state.globalBuff) || 0;

  RESOURCE_TYPES.forEach(res => {
    const specificBuff = parseFloat(state[`${res.key}Speed`]) || 0;
    
    for (let level = 7; level >= 1; level--) {
      const baseAmount = BASE_AMOUNTS[level];
      const seconds = calculateSeconds(baseAmount, globalBuff, specificBuff);
      const cell = document.getElementById(`time-${res.key}-${level}`);
      if (cell) {
        cell.innerText = formatTime(seconds);
      }
    }
  });
}

// --- イベントリスナー初期化 ---
function init() {
  loadState();

  // 言語ドロップダウン
  const langSelect = document.getElementById('langSelect');
  langSelect.value = state.lang;
  langSelect.addEventListener('change', (e) => {
    state.lang = e.target.value;
    saveState();
    updateLanguage();
  });

  // 全体バフ入力
  const globalBuffInput = document.getElementById('globalBuff');
  globalBuffInput.value = state.globalBuff;
  globalBuffInput.addEventListener('input', (e) => {
    state.globalBuff = parseFloat(e.target.value) || 0;
    saveState();
    recalculate();
  });

  // テーブル生成 & 初期計算
  renderTable();
  updateLanguage();
  recalculate();
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
