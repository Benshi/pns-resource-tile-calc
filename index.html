<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採集時間算出ツール</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧮%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="ui-title">採集時間算出ツール</h1>

      <section class="preset-container" aria-label="プリセット">
        <label for="presetSelect" id="ui-presetLabel">プリセット:</label>
        <select id="presetSelect" class="preset-select">
          <option value="">-- プリセット選択 --</option>
        </select>
        <div class="preset-actions">
          <input type="text" id="presetNameInput" class="preset-input" placeholder="名前 (アカウント名等)" maxlength="40">
          <button type="button" id="savePresetBtn" class="button button-primary">保存</button>
          <button type="button" id="deletePresetBtn" class="button button-danger">削除</button>
        </div>
      </section>

      <label class="language-picker" for="langSelect">
        <span class="sr-only">言語</span>
        <select id="langSelect">
          <option value="ja">🇯🇵 日本語</option>
          <option value="en">🇺🇸 English</option>
          <option value="zh-TW">🇹🇼 繁體中文</option>
          <option value="zh-CN">🇨🇳 简体中文</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="ru">🇷🇺 Русский</option>
        </select>
      </label>
    </header>

    <section class="resource-panel" aria-label="資源別採集速度">
      <div class="resource-panel-toolbar">
        <div class="mode-switch" role="group" aria-label="表示モード">
          <button type="button" class="mode-button is-active" data-mode="level">レベル別</button>
          <button type="button" class="mode-button" data-mode="capacity">時間別</button>
        </div>
        <div class="buff-actions">
          <button type="button" id="helpBtn" class="help-button" aria-label="バフの確認方法">
            <span aria-hidden="true">?</span>
            <span id="ui-helpBtnText">バフの確認方法</span>
          </button>
          <button type="button" id="toggleBuffSettingsBtn" class="buff-toggle-button">
            <span aria-hidden="true">⚙</span>
            <span id="ui-toggleBuffSettingsText">バフ設定を隠す</span>
          </button>
        </div>
        <div class="view-options" id="viewOptions">
          <label class="checkbox-control" id="showLevel8Control">
            <input type="checkbox" id="showLevel8Check">
            <span id="ui-showLevel8Label">Lv8以上も表示</span>
          </label>
          <label class="checkbox-control" id="showSecondsControl">
            <input type="checkbox" id="showSecondsCheck">
            <span id="ui-showSecondsLabel">秒まで表示</span>
          </label>
          <label class="capacity-options is-hidden" id="capacityOptions" for="capacityInterval">
            <span id="ui-capacityIntervalLabel">単位時間:</span>
            <select id="capacityInterval">
              <option value="5">5分</option>
              <option value="10">10分</option>
              <option value="15">15分</option>
              <option value="30">30分</option>
              <option value="60">1時間</option>
            </select>
          </label>
        </div>
      </div>
      <div class="table-wrapper" id="tableWrapper">
        <table id="calculatorTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="capacityLegend" class="capacity-legend" aria-label="資源レベル帯の凡例"></div>
    </section>

    <section class="share-container">
      <label for="shareUrlInput" class="share-title" id="ui-shareTitle">共有 / 保存用 URL</label>
      <div class="share-input-group">
        <input type="text" id="shareUrlInput" readonly>
        <button type="button" id="copyBtn" class="button button-secondary">コピー</button>
      </div>
    </section>

    <footer>
      <div>Copyright &copy; 2026 Orator. All rights reserved.</div>
      <div>GitHub: <a href="https://github.com/Benshi/pns-resource-tile-calc">Benshi/pns-resource-tile-calc</a></div>
    </footer>
  </main>

  <div id="helpModal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
    <div class="modal-content">
      <div class="modal-heading">
        <h2 id="helpModalTitle">採集速度の確認方法</h2>
        <button type="button" id="closeModalIcon" class="modal-close-icon" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-img-wrapper">
        <img id="helpImage" class="modal-img" src="" alt="採集速度バフの確認方法">
      </div>
      <button type="button" id="closeModalBtn" class="button button-secondary">閉じる</button>
    </div>
  </div>

  <div id="pinnedTooltip" class="tooltip-popup" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
